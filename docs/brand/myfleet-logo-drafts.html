<!DOCTYPE html><html><head><meta charset="utf-8"><title>myfleet logo drafts</title>
<style>
body{margin:0;background:#f5f5f3;font:13px/1.4 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#555}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0}
.c{height:300px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.l{background:#f5f5f3;color:#0a0a0a}.d{background:#0a0a0a;color:#f5f5f3}
svg{overflow:visible}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
h2{margin:0;padding:18px 28px;font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:#fff}
.tile{width:96px;height:96px;border-radius:22px;background:#0a0a0a;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:24px;align-items:center}
</style></head><body>
<h2>A — Wordmark: MYFLEET, built from straight strokes</h2>

<div class="c d"><svg width="372" height="48" viewBox="0 0 186 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="miter"><path d="M0 24V0L9 13L18 0V24M28 0L37 12L46 0M37 12V24M56 24V0H74M56 11H70M84 0V24H102M130 0H112V24H130M112 12H127M158 0H140V24H158M140 12H155M168 0H186M177 0V24"/></svg><span class="cap">dark</span></div>
</div>

<div class="c l"><div class="row">

<svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6"><g transform="skewX(-12) translate(6 0)"><path d="M14 6V42M14 6H42M14 22H34M14 38H26"/></g></svg>

</div><span class="cap">1 route-f &nbsp; 2 motion-F &nbsp; 3 M waypoint</span></div>

</div><span class="cap">app icon</span></div>
</div>
