name: CI

# Runs on every push and pull request: the backend tests (against an in-memory
# MongoDB) and a production build of the frontend.
on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx jest --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET_KEY: ci-test-secret
          JWT_EXPIRES: 1d

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # lint warnings in older pages shouldn't fail the build; real errors still do
          CI: "false"
          GENERATE_SOURCEMAP: "false"
